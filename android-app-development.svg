<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#34A853"></rect>

  <!-- Phone Body -->
  <rect x="146" y="80" width="220" height="352" rx="28" fill="#FFFFFF"></rect>

  <!-- Screen -->
  <rect x="162" y="110" width="188" height="280" rx="12" fill="#E8F5E9"></rect>

  <!-- Android Head -->
  <rect x="206" y="180" width="100" height="80" rx="20" fill="#3DDC84"></rect>
  <circle cx="236" cy="215" r="5" fill="#FFFFFF"></circle>
  <circle cx="276" cy="215" r="5" fill="#FFFFFF"></circle>

  <!-- Antennas -->
  <line x1="225" y1="180" x2="210" y2="155" stroke="#3DDC84" stroke-width="6" stroke-linecap="round"></line>
  <line x1="287" y1="180" x2="302" y2="155" stroke="#3DDC84" stroke-width="6" stroke-linecap="round"></line>

  <!-- Android Body -->
  <rect x="206" y="260" width="100" height="70" rx="10" fill="#3DDC84"></rect>

  <!-- Arms -->
  <rect x="185" y="265" width="15" height="55" rx="7" fill="#3DDC84"></rect>
  <rect x="312" y="265" width="15" height="55" rx="7" fill="#3DDC84"></rect>

  <!-- Legs -->
  <rect x="225" y="330" width="15" height="40" rx="7" fill="#3DDC84"></rect>
  <rect x="272" y="330" width="15" height="40" rx="7" fill="#3DDC84"></rect>

  <!-- App Title -->
  <text x="256" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF">
    Android App
